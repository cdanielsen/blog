# Node version comes from .nvmrc
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 301

# Browsers must always revalidate the service worker kill switch
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
